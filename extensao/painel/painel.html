<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Comunique</title>
<link rel="stylesheet" href="painel.css">
</head>
<body>
<header class="topo">
  <img class="simbolo" src="../icones/simbolo.svg" alt="">
  <h1>Comunique</h1>
  <button class="link" type="button" id="b-sair" hidden>Sair</button>
</header>

<main>
  <section id="v-entrar" hidden>
    <h2>Entre para começar</h2>
    <p class="meta">Use a mesma conta Google do Comunique. A extensão mostra seus avisos, busca entregadores e abre as telas mais usadas.</p>
    <button class="btn primario" type="button" id="b-entrar">Entrar com Google</button>
    <p class="erro" id="e-entrar" role="alert" hidden></p>
  </section>

  <section id="v-form" hidden>
    <div class="titulo-form"><button class="link" type="button" id="b-voltar">← Voltar</button><h2 id="t-form"></h2><button class="link reler" type="button" id="b-reler" title="Ler de novo o ID, o nome e a cidade da página aberta">↻ Ler a tela de novo</button></div>
    <div id="caixa-form"></div>
  </section>

  <section id="v-app" hidden>
    <div id="tela" aria-live="polite"></div>
    <form id="busca" role="search" autocomplete="off">
      <label for="q" class="so-leitor">Buscar entregador</label>
      <input id="q" type="search" placeholder="Buscar ID ou nome" spellcheck="false">
    </form>
    <div id="resultados" aria-live="polite"></div>

    <h2>Registrar</h2>
    <p class="meta">Lê o ID, o nome e a cidade da página aberta (Quero Log ou Crisp) e preenche aqui. Você confere e registra.</p>
    <nav class="atalhos" aria-label="Registrar">
      <button type="button" data-acao="bloqueio"><span data-icone="bloqueio"></span>Novo bloqueio</button>
      <button type="button" data-acao="cadastro"><span data-icone="ativacao"></span>Nova ativação</button>
      <button type="button" data-acao="adicional"><span data-icone="adicional"></span>Registrar adicional</button>
      <button type="button" data-acao="entregador"><span data-icone="entregador"></span>Cadastrar entregador</button>
      <button type="button" data-acao="calculadora"><span data-icone="calculadora"></span>Calculadora de bairro</button>
      <button type="button" data-acao="ajuda" class="ajuda"><span data-icone="ajuda"></span>Pedir ajuda</button>
    </nav>
    <p class="ok" id="feito" role="status" hidden></p>

    <div id="agora"></div>

    <div class="titulo-avisos">
      <h2>Avisos <span class="conta" id="c-avisos" hidden></span></h2>
      <button class="link" type="button" id="b-lidos" hidden>Marcar como lidos</button>
    </div>
    <ul class="avisos" id="avisos"></ul>
    <p class="erro" id="e-app" role="alert" hidden></p>
    <button class="link" type="button" id="b-abrir">Abrir o Comunique</button>
  </section>
</main>
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="../icones.js"></script>
<script src="../formularios.js"></script>
<script src="painel.js"></script>
</body>
</html>
