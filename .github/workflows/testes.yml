# 009z (A7-11): a cada envio, o GitHub roda os testes do banco, o site inteiro (e2e) e a extensão.
# Usa um Postgres de mentira só do teste (sem dado real e sem senha de verdade) e o Chromium do Playwright.
# 009z5 (A13-21/A7-27): roda uma vez por envio (só na main e nos pedidos de mudança, não de novo no ramo de trabalho)
# e o site só vai ao ar DEPOIS dos testes passarem (job "publicar"). Para isso valer, o Pages precisa estar em
# Settings → Pages → Source → "GitHub Actions" (troca feita uma vez pelo dono).
name: Testes
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:teste@127.0.0.1:5432/teste
      TZ: America/Sao_Paulo
    defaults:
      run:
        working-directory: testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: testes/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Banco (funções, permissões e regras)
        run: npm run test:banco
      - name: Site inteiro (e2e)
        run: npm run test:e2e
      - name: Extensão do Chrome
        run: npm run test:extensao
      - name: Prints do e2e (quando falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prints
          path: testes/prints/
          retention-days: 7
  publicar:
    needs: testes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true  # enquanto o Pages não estiver em "GitHub Actions", este passo falha sem deixar os testes vermelhos
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
